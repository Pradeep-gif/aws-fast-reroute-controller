name: Java quality gate
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - run: javac -d out src/main/java/com/portfolio/reroute/*.java src/test/java/com/portfolio/reroute/*.java
      - run: java -ea -cp out com.portfolio.reroute.FastRerouteControllerTest
